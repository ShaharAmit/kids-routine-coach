<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9eb"/>
      <stop offset="55%" stop-color="#f7e2b2"/>
      <stop offset="100%" stop-color="#edc97d"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f08b45"/>
      <stop offset="100%" stop-color="#e85f2a"/>
    </linearGradient>
    <clipPath id="chipClip"><rect x="72" y="34" width="60" height="60" rx="16"/></clipPath>
    <clipPath id="avatarClip"><rect x="656" y="38" width="504" height="554" rx="32"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <circle cx="-10" cy="-20" r="100" fill="rgba(255,214,119,0.38)"/>
  <circle cx="520" cy="700" r="130" fill="rgba(240,139,69,0.14)"/>
  <circle cx="730" cy="30" r="50" fill="rgba(232,95,42,0.1)"/>

  <!-- KC chip -->
  <rect x="72" y="88" width="60" height="60" rx="16" fill="url(#chip)"/>
  <text x="102" y="127" font-family="'Baloo 2', Nunito, sans-serif" font-size="20" font-weight="800" fill="#fff9f0" text-anchor="middle">KC</text>

  <!-- Brand name -->
  <text x="146" y="129" font-family="'Baloo 2', Nunito, sans-serif" font-size="32" font-weight="800" fill="#49320d">Kidocoach</text>

  <!-- Eyebrow pill -->
  <rect x="72" y="178" width="220" height="32" rx="16" fill="rgba(255,208,128,0.55)"/>
  <text x="182" y="199" font-family="Nunito, sans-serif" font-size="16" font-weight="700" fill="#7a4f0f" text-anchor="middle">Morning Calm, Built In</text>

  <!-- Headline line 1 -->
  <text x="72" y="276" font-family="'Baloo 2', Nunito, sans-serif" font-size="52" font-weight="800" fill="#35240f" letter-spacing="-1.5">Meet Your Child's</text>
  <!-- Headline line 2 -->
  <text x="72" y="340" font-family="'Baloo 2', Nunito, sans-serif" font-size="52" font-weight="800" fill="#35240f" letter-spacing="-1.5">New Routine Coach</text>

  <!-- Subtitle line 1 -->
  <text x="72" y="392" font-family="Nunito, sans-serif" font-size="19" font-weight="600" fill="#6f5224">Calmer mornings, smoother bedtimes, and</text>
  <!-- Subtitle line 2 -->
  <text x="72" y="418" font-family="Nunito, sans-serif" font-size="19" font-weight="600" fill="#6f5224">healthier daily habits — built for families.</text>

  <!-- Avatar frame placeholder (actual PNG has photo) -->
  <rect x="656" y="38" width="504" height="554" rx="32" fill="#eeddb6"/>
  <text x="908" y="345" font-family="Nunito, sans-serif" font-size="20" font-weight="700" fill="#a07848" text-anchor="middle">[ Becky – AI Coach ]</text>

  <!-- Avatar badge -->
  <rect x="778" y="558" width="260" height="34" rx="17" fill="rgba(255,248,229,0.93)"/>
  <text x="908" y="580" font-family="Nunito, sans-serif" font-size="14" font-weight="800" fill="#7a4f0f" text-anchor="middle">🎓 AI Routine Coach</text>
</svg>
